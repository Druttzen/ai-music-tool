<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fail-Safe Ops</title>
    <style>
      :root {
        --bg: #12151a;
        --panel: #1b2129;
        --text: #e8eef5;
        --muted: #9aa7b5;
        --accent: #6ea8fe;
        --ok: #6bcf8e;
        --warn: #e6b35a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #243044 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.6rem;
        letter-spacing: 0.02em;
        margin: 0 0 0.35rem;
      }
      .sub {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        background: var(--panel);
        border: 1px solid #2d3744;
        border-radius: 10px;
        color: var(--text);
        padding: 0.85rem 1rem;
        font: 0.85rem/1.4 ui-monospace, Consolas, monospace;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin: 0.85rem 0 1.25rem;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #0b1220;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid #3a4656;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      pre {
        background: var(--panel);
        border: 1px solid #2d3744;
        border-radius: 10px;
        padding: 1rem;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 0.8rem/1.45 ui-monospace, Consolas, monospace;
      }
      .err {
        color: #ff8f8f;
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border: 1px solid #3a4656;
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Fail-Safe Ops · local shell</div>
      <h1>Diagnose CI failure</h1>
      <p class="sub">
        Paste a GitHub Actions failed log. Classification uses the shared playbooks (no network).
      </p>
      <label for="log">CI log</label>
      <textarea id="log" placeholder="gh run view &lt;id&gt; --log-failed"></textarea>
      <div class="row">
        <button class="primary" id="run" type="button">Diagnose</button>
        <button class="ghost" id="copy" type="button" disabled>Copy agent prompt</button>
      </div>
      <label for="out">Result</label>
      <pre id="out">Waiting…</pre>
    </main>
    <script>
      const logEl = document.getElementById("log");
      const outEl = document.getElementById("out");
      const runBtn = document.getElementById("run");
      const copyBtn = document.getElementById("copy");
      let lastPrompt = "";

      runBtn.addEventListener("click", async () => {
        runBtn.disabled = true;
        copyBtn.disabled = true;
        outEl.textContent = "Diagnosing…";
        outEl.classList.remove("err");
        try {
          const res = await fetch("/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ log: logEl.value || "" }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          lastPrompt = data.agentPrompt || "";
          outEl.textContent =
            (data.summary || "") + "\n\n---\n\n" + (data.agentPrompt || "");
          copyBtn.disabled = !lastPrompt;
        } catch (err) {
          outEl.classList.add("err");
          outEl.textContent = String(err?.message || err);
        } finally {
          runBtn.disabled = false;
        }
      });

      copyBtn.addEventListener("click", async () => {
        if (!lastPrompt) return;
        await navigator.clipboard.writeText(lastPrompt);
        copyBtn.textContent = "Copied";
        setTimeout(() => {
          copyBtn.textContent = "Copy agent prompt";
        }, 1200);
      });
    </script>
  </body>
</html>
