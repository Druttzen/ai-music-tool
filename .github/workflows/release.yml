name: Release (Electron retired)

# Electron Windows installer train retired after studio-v0.50.21
# (Studio canvas/video paths verified on tagged Studio). Ship Studio only:
#   npm run ship:tag  →  studio-v*  →  tauri-studio-release.yml
#
# This workflow fails fast so accidental dispatch does not rebuild Electron.
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to confirm you understand Electron shipping is disabled"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Electron train retired
        run: |
          echo "::error::Electron packaging retired after studio-v0.50.21. Ship Studio with: npm run ship:tag"
          echo "See docs/desktop.md and docs/architecture-convergence.md"
          if [ "${{ inputs.acknowledge }}" != "RETIRED" ]; then
            echo "Dispatch acknowledge must be exactly RETIRED (still exits non-zero)."
          fi
          exit 1
