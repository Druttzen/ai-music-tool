name: Tauri Studio Release

on:
  workflow_dispatch:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: write

jobs:
  build-and-sign:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmp3lame-dev
      - run: npm ci
      - name: Verify pinned Tauri CLI
        run: npx tauri --version
      - run: npm run sync:version
      - run: npm run check:full
      - name: Build signed Studio bundles and updater manifest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: npx tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/studio-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/studio-v') && format('AI Music Creator Studio {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          retryAttempts: 2
      - name: Native updater and component tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Installed Windows upgrade and duplicate installation smoke
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/studio-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/test-windows-studio-upgrade.ps1

  publish-release:
    needs: build-and-sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/studio-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify updater manifest and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          gh api "repos/$REPO/releases/tags/$TAG" > release-assets/release.json
          gh release download "$TAG" --repo "$REPO" --dir release-assets
          node scripts/verify-studio-release.cjs release-assets
          gh release upload "$TAG" --repo "$REPO" release-assets/latest.json release-assets/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
